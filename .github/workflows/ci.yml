name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

  exported-code:
    # Runs the Qiskit, Cirq, pyQuil and OpenQASM code Qanvas generates in the quantum-lab image.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:export

  server-image:
    # Builds the quantum-lab web-server image so a broken Dockerfile shows up before a release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t qanvas:ci .
      - name: Serve the page, with /api/ only when a lab bridge is set
        run: |
          docker run -d --name qanvas -p 127.0.0.1:8080:8080 qanvas:ci
          sleep 2
          curl -fsS http://127.0.0.1:8080/ | grep -q '<title>Qanvas</title>'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/health)" = 404
          docker rm -f qanvas
          docker run -d --name qanvas -e QANVAS_BRIDGE_URL=http://lab-bridge:8000 qanvas:ci
          sleep 2
          docker exec qanvas grep -q 'proxy_pass' /etc/nginx/qanvas/bridge.conf
