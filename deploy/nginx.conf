server {
    listen 8080;
    root /usr/share/nginx/html;

    # File names under assets/ change with their content, so they can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The page and the service worker must be checked on every visit so updates arrive.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # nginx doesn't know the .webmanifest extension.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
